name: "Build Binary"
description: "Builds a Rust binary using Nix and uploads artifact"
inputs:
  binary_package:
    description: "Cargo package name to build"
    required: true
  profile:
    description: "Cargo build profile"
    required: true
  features:
    description: "Cargo features to enable"
    required: false
    default: ""
  github_token:
    description: "GitHub token for Nix installation"
    required: true
  cachix_auth_token:
    description: "Optional Cachix auth token for write access"
    required: false
    default: ""
  git_sha:
    description: "Git SHA to use for artifact naming (defaults to GITHUB_SHA)"
    required: false
    default: ""

outputs:
  artifact_name:
    description: "The name of the uploaded artifact"
    value: ${{ inputs.binary_package }}-${{ env.SHORT_SHA }}

runs:
  using: "composite"
  steps:
  - run: sudo apt-get update && sudo apt-get install -y xz-utils
    shell: bash
  - uses: cachix/install-nix-action@v27
    with:
      github_access_token: ${{ inputs.github_token }}
      nix_path: nixpkgs=channel:nixos-unstable
  - uses: cachix/cachix-action@v15
    if: ${{ inputs.cachix_auth_token != '' }}
    with:
      name: movement-m1
      authToken: ${{ inputs.cachix_auth_token }}
      skipPush: true
  - uses: cachix/cachix-action@v15
    if: ${{ inputs.cachix_auth_token == '' }}
    with:
      name: movement-m1
      skipPush: true
  - run: |
      set -euo pipefail
      set -o pipefail
      TARGET_FOLDER="target/${{ inputs.profile }}"
      mkdir -p "$TARGET_FOLDER"

      if [ "${{ inputs.profile }}" = "release" ]; then
        nix --extra-experimental-features "nix-command flakes" build ".#${{ inputs.binary_package }}" -L --print-build-logs 2>&1 | tee /tmp/nix-build-${{ inputs.binary_package }}.log

        if grep -Eiq "cachix\\.org|copying path" /tmp/nix-build-${{ inputs.binary_package }}.log; then
          echo "Cache activity detected for ${{ inputs.binary_package }}"
        else
          echo "No explicit cache download line detected for ${{ inputs.binary_package }}"
        fi

        cp "result/bin/${{ inputs.binary_package }}" "$TARGET_FOLDER/${{ inputs.binary_package }}"
      else
        echo "::warning::Profile '${{ inputs.profile }}' is not exposed as a Nix flake output; falling back to cargo build in nix develop."
        nix --extra-experimental-features "nix-command flakes" develop -c cargo build -p "${{ inputs.binary_package }}" --profile "${{ inputs.profile }}" --features "${{ inputs.features }}"
      fi

      chmod +x "$TARGET_FOLDER/${{ inputs.binary_package }}"
      echo "TARGET_FOLDER=$TARGET_FOLDER" >> "$GITHUB_ENV"
    shell: bash
  - name: shorten sha
    run: |
      if [ -n "${{ inputs.git_sha }}" ]; then
        SHORT_SHA=$(echo "${{ inputs.git_sha }}" | cut -c1-7)
      else
        SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)
      fi
      echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
    shell: bash
  - run: |
      if [ -f "${{ env.TARGET_FOLDER }}/${{ inputs.binary_package }}" ]; then
        echo "✅ Binary ${{ inputs.binary_package }} built successfully"
      else
        echo "❌ Binary ${{ inputs.binary_package }} not found"
        exit 1
      fi
    shell: bash
  - uses: actions/upload-artifact@v4
    with:
      name: ${{ inputs.binary_package }}-${{ env.SHORT_SHA }}
      path: ${{ env.TARGET_FOLDER }}/${{ inputs.binary_package }}
      retention-days: 7
