name: "Build Binary"
description: "Builds Rust binaries using Nix - builds default-members plus any additional specified binaries"
author: "Movement Labs"

inputs:
  defaults:
    description: "Whether to build all default-members from Cargo.toml"
    required: false
    default: "true"
  binaries:
    description: "List of additional binaries to build (comma-separated string or YAML list)"
    required: false
    default: ""
  profile:
    description: "Cargo build profile (release, dev, or custom profile name)"
    required: true
  separate_artifacts:
    description: "Upload each binary as a separate artifact (true) or all in one artifact (false)"
    required: false
    default: "false"

outputs:
  artifact_name:
    description: "The name of the uploaded artifact (or base name if separate_artifacts=true)"
  binaries_built:
    description: "JSON array of binaries that were built"

runs:
  using: "node20"
  main: "dist/index.js"
