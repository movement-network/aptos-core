name: "Build Container"
description: "Builds and pushes Docker container images with configurable inputs"
inputs:
  image_name:
    description: "Full Docker image name (e.g., ghcr.io/org/repo/image)"
    required: true
  dockerfile_subdir:
    description: "Subdirectory under 'docker/' containing the Dockerfile (e.g., 'aptos-node')"
    required: true
  build_args:
    description: "Multi-line string of Docker build arguments (e.g., 'BINARY_PATH=target/debug ANOTHER_ARG=value')"
    required: false
    default: ""
  ghcr_username:
    description: "Username for GHCR login"
    required: true
  ghcr_password:
    description: "Password for GHCR login"
    required: true

outputs:
  image_name:
    description: "The Docker image name that was built and pushed"
    value: ${{ inputs.image_name }}
  image_tag:
    description: "The tag of the Docker image that was built and pushed"
    value: ${{ steps.set_env.outputs.git_sha_short }}
  dockerfile_path:
    description: "The path to the Dockerfile"
    value: ${{ steps.set_env.outputs.dockerfile_path }}
  build_args_formatted:
    description: "Formatted build arguments"
    value: ${{ steps.format_args.outputs.build_args }}

runs:
  using: "composite"
  steps:
  - name: Set build environment
    id: set_env
    run: |
      GIT_SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
      echo "git_sha_short=$GIT_SHA_SHORT" >> $GITHUB_OUTPUT
      echo "dockerfile_path=docker/${{ inputs.dockerfile_subdir }}/Dockerfile" >> $GITHUB_OUTPUT
    shell: bash

  - name: Verify Dockerfile exists
    run: |
      DOCKERFILE_PATH="docker/${{ inputs.dockerfile_subdir }}/Dockerfile"
      if [ ! -f "$DOCKERFILE_PATH" ]; then
        echo "Error: Dockerfile not found at $DOCKERFILE_PATH"
        exit 1
      fi
    shell: bash

  - name: Format build args
    id: format_args
    run: |
      # Convert multi-line build args to comma-separated format for Kaniko
      BUILD_ARGS=""
      while IFS= read -r line; do
        if [[ -n "$line" ]]; then
          if [[ -z "$BUILD_ARGS" ]]; then
            BUILD_ARGS="$line"
          else
            BUILD_ARGS="$BUILD_ARGS,$line"
          fi
        fi
      done <<< "${{ inputs.build_args }}"
      echo "build_args=$BUILD_ARGS" >> $GITHUB_OUTPUT
    shell: bash
