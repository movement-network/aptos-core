name: Rust Targeted Unit Tests
description: Runs only the targeted rust unit tests
inputs:
  GIT_CREDENTIALS:
    description: "Optional credentials to pass to git. Useful if you need to pull private repos for dependencies"
    required: false

runs:
  using: composite
  steps:
    # The source code must be checked out by the workflow that invokes this action.

    # Run a postgres database
    - name: Run postgres database
      run: |
        if [ "${USE_POSTGRES_SERVICE:-}" = "true" ]; then
          echo "Using workflow postgres service."
          exit 0
        fi
        docker run --detach -p 5432:5432 cimg/postgres:14.2
      shell: bash

    # Pull requests compare against their base branch. A push has no base branch,
    # so use the revision GitHub reports immediately before this push instead.
    # A manual run compares against the current revision's first parent.
    - name: Select the changed-files baseline
      shell: bash
      run: |
        set -euo pipefail
        case "$GITHUB_EVENT_NAME" in
          pull_request)
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            ;;
          push)
            base_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$base_sha" =~ ^0{40}$ ]]; then
              echo "GitHub did not provide a usable pre-push revision." >&2
              exit 1
            fi
            git cat-file -e "${base_sha}^{commit}"
            echo "APTOS_CARGO_CHANGED_FILES_BASE=$base_sha" >> "$GITHUB_ENV"
            ;;
          workflow_dispatch)
            base_sha="$(git rev-parse --verify HEAD^ 2>/dev/null)" || {
              echo "A manual targeted-test run requires a parent revision." >&2
              exit 1
            }
            echo "APTOS_CARGO_CHANGED_FILES_BASE=$base_sha" >> "$GITHUB_ENV"
            ;;
          *)
            echo "Unsupported event for targeted changed-file selection: $GITHUB_EVENT_NAME" >&2
            exit 1
            ;;
        esac

    # Output the changed files
    - name: Output the changed files
      run: cargo x changed-files -vvv
      shell: bash

    # Output the affected packages
    - name: Output the affected packages
      run: cargo x affected-packages -vvv
      shell: bash

    # Run only the targeted rust unit tests
    - name: Run only the targeted unit tests
      run: |
        export INDEXER_DATABASE_URL="${INDEXER_DATABASE_URL:-postgresql://postgres@localhost/postgres}"
        export Z3_EXE="${Z3_EXE:-$HOME/bin/z3}"
        export CVC5_EXE="${CVC5_EXE:-$HOME/bin/cvc5}"
        export DOTNET_ROOT="${DOTNET_ROOT:-$HOME/.dotnet}"
        export BOOGIE_EXE="${BOOGIE_EXE:-$DOTNET_ROOT/tools/boogie}"
        cargo x targeted-unit-tests -vvv --profile ci --cargo-profile ci --locked --no-fail-fast --retries 3
      shell: bash
      env:
        RUST_MIN_STACK: "33554432"
        MVP_TEST_ON_CI: "true"
