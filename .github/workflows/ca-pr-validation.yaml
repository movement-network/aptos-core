name: "CA PR Validation"

# Comprehensive PR validation workflow combining all verification checks.
# Runs on every PR to ensure code quality, verification correctness,
# and documentation completeness before merge.

on:
  pull_request:
    paths:
      - 'aptos-move/framework/formal/**'
      - 'aptos-move/framework/aptos-experimental/sources/confidential_asset/**'
      - '.github/workflows/ca-*.yaml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quick-checks:
    name: "Quick validation checks"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          # Check that commit messages are descriptive
          git log --format=%B origin/${{ github.base_ref }}..HEAD | while read line; do
            if [ -n "$line" ] && [ ${#line} -lt 10 ]; then
              echo "::error::Commit message too short: $line"
              exit 1
            fi
          done

      - name: Check for debug artifacts
        run: |
          # Ensure no debug artifacts are committed
          if find aptos-move/framework/formal -name "*.log" -o -name "*.tmp" -o -name "*~" | grep .; then
            echo "::error::Debug artifacts found - please remove before committing"
            exit 1
          fi

      - name: Check file permissions
        run: |
          # Ensure scripts are executable
          find aptos-move/framework/formal/scripts -name "*.sh" -type f ! -perm -111 | while read file; do
            echo "::error::Script not executable: $file"
            exit 1
          done

      - name: Validate YAML syntax
        run: |
          # Check workflow YAML files are valid
          if command -v yamllint &> /dev/null; then
            yamllint .github/workflows/ca-*.yaml || echo "::warning::yamllint not available"
          fi

  lean-verification:
    name: "Lean verification"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain v4.24.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean installation
        run: |
          lean --version
          lake --version

      - name: Fetch mathlib cache
        working-directory: aptos-move/framework/formal/lean
        run: |
          lake exe cache get || echo "::warning::Cache fetch failed, will build from source"

      - name: Build Lean tree
        working-directory: aptos-move/framework/formal/lean
        run: |
          lake build

      - name: Verify all 5 operations
        working-directory: aptos-move/framework/formal
        run: |
          for op in register withdraw transfer normalize rotate; do
            echo "Verifying $op..."
            ./audit/verify-ca.sh --op $op --stack lean || exit 1
          done

      - name: Check sorry count
        working-directory: aptos-move/framework/formal
        run: |
          SORRY_COUNT=$(grep -r "sorry" lean/MovementFormal/Experimental/ConfidentialAsset/ --include="*.lean" | grep -v "SORRY" | grep -v "comment" | wc -l | tr -d ' ')
          BASELINE=21
          if [ "$SORRY_COUNT" -gt "$BASELINE" ]; then
            echo "::error::Sorry count regression: $SORRY_COUNT > $BASELINE"
            exit 1
          elif [ "$SORRY_COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Sorry count improved: $SORRY_COUNT < $BASELINE"
          fi
          echo "Sorry count: $SORRY_COUNT (baseline: $BASELINE)"

  axiom-verification:
    name: "Axiom baseline check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain v4.24.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch mathlib cache
        working-directory: aptos-move/framework/formal/lean
        run: |
          lake exe cache get || echo "::warning::Cache fetch failed"

      - name: Build Lean tree
        working-directory: aptos-move/framework/formal/lean
        run: |
          lake build

      - name: Check axiom drift
        working-directory: aptos-move/framework/formal
        run: |
          if ! ./scripts/check_axioms.sh --diff; then
            echo "::error::Axiom drift detected - new axioms without baseline update"
            echo "::error::Run: ./scripts/check_axioms.sh > audit/axiom-baseline.txt"
            echo "::error::And update audit/AXIOM_INVENTORY.md with rationale"
            exit 1
          fi

      - name: Report axiom count
        working-directory: aptos-move/framework/formal
        run: |
          AXIOM_COUNT=$(./scripts/check_axioms.sh --baseline 2>/dev/null | grep -c "^axiom" || echo 0)
          echo "Current axiom count: $AXIOM_COUNT"
          echo "Expected: 149 (144 permanent + 5 TEMPORARY)"

  trust-boundaries:
    name: "Trust boundaries reconciliation"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain v4.24.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch mathlib cache
        working-directory: aptos-move/framework/formal/lean
        run: |
          lake exe cache get || echo "::warning::Cache fetch failed"

      - name: Build Lean tree
        working-directory: aptos-move/framework/formal/lean
        run: |
          lake build

      - name: Reconcile trust boundaries
        working-directory: aptos-move/framework/formal
        run: |
          if ! ./scripts/reconcile_trust_boundaries.sh; then
            echo "::error::Trust boundaries out of sync"
            echo "::error::Run: ./scripts/reconcile_trust_boundaries.sh --verbose"
            exit 1
          fi

  documentation-quality:
    name: "Documentation quality check"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation freshness
        working-directory: aptos-move/framework/formal
        run: |
          STALE=0
          for doc in audit/*.md *.md; do
            if [ -f "$doc" ]; then
              if grep -q "Last updated:" "$doc"; then
                DATE=$(grep "Last updated:" "$doc" | sed -n 's/.*\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\).*/\1/p' | head -1)
                if [ -n "$DATE" ]; then
                  DATE_UNIX=$(date -d "$DATE" +%s 2>/dev/null || echo 0)
                  NOW_UNIX=$(date +%s)
                  DIFF_DAYS=$(( (NOW_UNIX - DATE_UNIX) / 86400 ))
                  if [ $DIFF_DAYS -gt 90 ]; then
                    echo "::warning::$doc is stale (last updated $DIFF_DAYS days ago)"
                    STALE=$((STALE + 1))
                  fi
                fi
              fi
            fi
          done

          if [ $STALE -gt 5 ]; then
            echo "::error::$STALE documents are stale (>90 days old)"
            exit 1
          fi

      - name: Check for broken links
        working-directory: aptos-move/framework/formal
        run: |
          # Check for broken internal links in documentation
          grep -r '\[.*\](.*\.md)' audit/*.md *.md | while IFS=: read -r file link; do
            target=$(echo "$link" | sed -n 's/.*(\(.*\.md\)).*/\1/p')
            if [ -n "$target" ] && [ ! -f "$(dirname "$file")/$target" ] && [ ! -f "$target" ]; then
              echo "::warning::Broken link in $file: $target"
            fi
          done

      - name: Validate deliverables
        working-directory: aptos-move/framework/formal
        run: |
          if ! ./scripts/validate_deliverables.sh; then
            echo "::error::Phase 7 deliverables incomplete or invalid"
            exit 1
          fi

  integration-tests:
    name: "Integration test suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain v4.24.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch mathlib cache
        working-directory: aptos-move/framework/formal/lean
        run: |
          lake exe cache get || echo "::warning::Cache fetch failed"

      - name: Run integration tests
        working-directory: aptos-move/framework/formal
        run: |
          ./scripts/integration_test_suite.sh --fast

  performance-check:
    name: "Performance regression check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: baseline

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain v4.24.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Benchmark baseline
        working-directory: baseline/aptos-move/framework/formal
        run: |
          cd lean && lake exe cache get || true && cd ..
          ./scripts/benchmark_verification.sh --output json > /tmp/baseline.json || echo "{}" > /tmp/baseline.json

      - name: Benchmark current
        working-directory: current/aptos-move/framework/formal
        run: |
          cd lean && lake exe cache get || true && cd ..
          ./scripts/benchmark_verification.sh --output json > /tmp/current.json || echo "{}" > /tmp/current.json

      - name: Detect regressions
        working-directory: current/aptos-move/framework/formal
        run: |
          if ! ./scripts/detect_performance_regression.sh /tmp/baseline.json /tmp/current.json; then
            echo "::warning::Performance regression detected (see details above)"
            # Don't fail PR on performance regression, just warn
          fi

  pr-summary:
    name: "PR validation summary"
    runs-on: ubuntu-latest
    needs: [quick-checks, lean-verification, axiom-verification, trust-boundaries, documentation-quality, integration-tests, performance-check]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Quick checks', status: '${{ needs.quick-checks.result }}' },
              { name: 'Lean verification', status: '${{ needs.lean-verification.result }}' },
              { name: 'Axiom verification', status: '${{ needs.axiom-verification.result }}' },
              { name: 'Trust boundaries', status: '${{ needs.trust-boundaries.result }}' },
              { name: 'Documentation quality', status: '${{ needs.documentation-quality.result }}' },
              { name: 'Integration tests', status: '${{ needs.integration-tests.result }}' },
              { name: 'Performance check', status: '${{ needs.performance-check.result }}' }
            ];

            const passed = jobs.filter(j => j.status === 'success').length;
            const failed = jobs.filter(j => j.status === 'failure').length;
            const total = jobs.length;

            const statusEmoji = failed === 0 ? '✅' : '❌';
            const statusText = failed === 0 ? 'All checks passed' : `${failed} check(s) failed`;

            const jobList = jobs.map(j => {
              const emoji = j.status === 'success' ? '✅' : j.status === 'failure' ? '❌' : '⚠️';
              return `- ${emoji} ${j.name}`;
            }).join('\n');

            const body = `
            ## ${statusEmoji} CA Formal Verification PR Validation

            **Status:** ${statusText} (${passed}/${total})

            ### Check Results

            ${jobList}

            ### Next Steps

            ${failed === 0
              ? '✅ All checks passed! This PR is ready for review.'
              : '❌ Please address the failed checks before merging. Review the workflow logs for details.'
            }

            ---
            *View detailed logs:* [Workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(c =>
              c.body && c.body.includes('CA Formal Verification PR Validation')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
