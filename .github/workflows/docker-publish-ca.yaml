name: Publish CA Formal Verification Docker Image

on:
  push:
    tags:
      - 'v*'
      - 'ca-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ca-formal-verification

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: aptos-move/framework/formal/audit/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest lean --version
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest lake --version

      - name: Generate image digest
        id: digest
        run: |
          DIGEST=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format='{{index .RepoDigests 0}}')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Image digest: ${DIGEST}"

      - name: Create release note
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > release-note.md <<EOF
          ## Docker Image Published

          **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`
          **Tags:** \`${{ steps.meta.outputs.tags }}\`
          **Digest:** \`${{ steps.digest.outputs.digest }}\`

          ### Usage

          \`\`\`bash
          # Pull the image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Run verification
          docker run --rm \\
            -v \$(pwd):/workspace \\
            -w /workspace \\
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \\
            ./audit/verify-ca.sh
          \`\`\`

          ### Verification

          \`\`\`bash
          # Verify image integrity
          docker pull ${{ steps.digest.outputs.digest }}
          \`\`\`
          EOF

          cat release-note.md

      - name: Comment on PR (if triggered by PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: '✅ Docker image built successfully!\\n\\nImage: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`'
            })
