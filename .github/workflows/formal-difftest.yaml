---
# Move VM → JSON oracle → Lean differential smoke (formal framework).
# Runs on ubuntu-latest; does not use repo-specific k8s runners.
#
# Two parallel jobs:
#   1. rust-oracle: Rust corpora + VM oracle + CA e2e fragment → merged JSON artifact
#   2. lean-proofs: Mathlib cache + lake build (all refinement proofs + specs)
# Then a third job combines them: downloads the JSON artifact and runs `lake exe difftest`.
name: "Formal verification"
on:
  pull_request:
    paths:
      - "aptos-move/framework/formal/difftest/**"
      - "aptos-move/framework/formal/lean/**"
      - "aptos-move/framework/formal/difftest.sh"
      - "aptos-move/framework/formal/scripts/**"
      - "aptos-move/e2e-move-tests/src/tests/confidential_asset_e2e.rs"
      - "aptos-move/e2e-move-tests/src/tests/confidential_asset_e2e_oracle_impl.rs"
      - "aptos-move/e2e-move-tests/Cargo.toml"
      - "aptos-move/aptos-vm/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Rust VM oracle + CA e2e → merged JSON ──────────────────────
  rust-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lld libudev-dev libclang-dev

      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-formal-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-formal-

      - name: Verify CA formal corpora (hex files, SHA3-512 chains; Rust)
        run: cargo run -p move-lean-difftest -- verify-corpora

      - name: VM oracle (harness)
        run: cargo run -p move-lean-difftest -- --quiet

      - name: CA e2e → oracle fragment (VM + Lean witness rows)
        run: |
          export CONFIDENTIAL_ASSET_E2E_ORACLE_OUT="$GITHUB_WORKSPACE/aptos-move/framework/formal/difftest/difftest_ca_e2e_fragment.json"
          RUST_MIN_STACK=8388608 cargo test -p e2e-move-tests export_confidential_asset_e2e_oracle_fragment -- --test-threads=1

      - name: Merge harness oracle + e2e fragment
        run: |
          cargo run -p move-lean-difftest -- merge -o aptos-move/framework/formal/difftest/difftest_ci_merged.json \
            aptos-move/framework/formal/difftest/difftest_oracle.json \
            aptos-move/framework/formal/difftest/difftest_ca_e2e_fragment.json

      - name: Upload merged oracle
        uses: actions/upload-artifact@v4
        with:
          name: difftest-oracle
          path: aptos-move/framework/formal/difftest/difftest_ci_merged.json
          retention-days: 1

  # ── Job 2: Lean proofs (refinement + specs) ───────────────────────────
  lean-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan (Lean)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: aptos-move/framework/formal/lean/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('aptos-move/framework/formal/lean/lean-toolchain', 'aptos-move/framework/formal/lean/lakefile.lean', 'aptos-move/framework/formal/lean/lake-manifest.json') }}
          restore-keys: ${{ runner.os }}-lake-

      - name: ConfidentialAsset Lean hygiene (no sorry; axiom allowlist)
        run: bash aptos-move/framework/formal/scripts/check_confidential_lean_hygiene.sh

      - name: Fetch Mathlib cache (precompiled .olean files)
        run: |
          cd aptos-move/framework/formal/lean
          for i in 1 2 3; do lake exe cache get! && break || sleep 10; done

      - name: Lean proofs (refinement + specs)
        run: |
          cd aptos-move/framework/formal/lean
          lake build

  # ── Job 3: Lean difftest (needs both Rust oracle + Lean build) ────────
  lean-difftest:
    runs-on: ubuntu-latest
    needs: [rust-oracle, lean-proofs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan (Lean)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: aptos-move/framework/formal/lean/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('aptos-move/framework/formal/lean/lean-toolchain', 'aptos-move/framework/formal/lean/lakefile.lean', 'aptos-move/framework/formal/lean/lake-manifest.json') }}
          restore-keys: ${{ runner.os }}-lake-

      - name: Fetch Mathlib cache
        run: |
          cd aptos-move/framework/formal/lean
          for i in 1 2 3; do lake exe cache get! && break || sleep 10; done

      - name: Build difftest executable
        run: |
          cd aptos-move/framework/formal/lean
          lake build difftest

      - name: Download merged oracle
        uses: actions/download-artifact@v4
        with:
          name: difftest-oracle
          path: aptos-move/framework/formal/difftest

      - name: Run Lean difftest
        run: |
          cd aptos-move/framework/formal/lean
          lake exe difftest ../difftest/difftest_ci_merged.json
