name: "Publish Builder Images"
run-name: "Publish builder images for ${{ inputs.ref || github.ref_name }}"

on:
  push:
    branches:
      - m1
    paths:
      - ".github/workflows/publish-builder-images.yaml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docker/builder/**"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build."
        required: true
        default: "m1"
      publish_latest:
        description: "Also publish the latest tag."
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/movementlabsxyz
  DEBIAN_CONTEXT: docker-image://debian:bullseye@sha256:cf48c31af360e1c0a0aedd33aae4d928b68c2cdf093f1612650eb1ff434d1c34
  PROFILE: release
  FEATURES: ""
  CARGO_TARGET_DIR: /aptos/target
  BUILT_VIA_BUILDKIT: "true"

jobs:
  publish:
    name: "Publish Rust builder images"
    runs-on: blacksmith-16vcpu-ubuntu-2204
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Derive image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          git_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          ref_name="${{ inputs.ref || github.ref_name }}"
          ref_tag="$(printf '%s' "$ref_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"
          rust_version="$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml)"
          if [ -z "$ref_tag" ]; then
            ref_tag="$short_sha"
          fi
          if [ -z "$rust_version" ]; then
            echo "Unable to determine Rust version from rust-toolchain.toml" >&2
            exit 1
          fi

          echo "git_sha=$git_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "ref_tag=$ref_tag" >> "$GITHUB_OUTPUT"
          echo "rust_context=docker-image://rust:${rust_version}-bullseye" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build aptos-node binary
        shell: bash
        env:
          GIT_SHA: ${{ steps.metadata.outputs.git_sha }}
          RUST_CONTEXT: ${{ steps.metadata.outputs.rust_context }}
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --file docker/builder/builder.Dockerfile \
            --target aptos-node-builder \
            --build-context "rust=$RUST_CONTEXT" \
            --build-arg "PROFILE=$PROFILE" \
            --build-arg "FEATURES=$FEATURES" \
            --build-arg "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" \
            --build-arg "BUILT_VIA_BUILDKIT=$BUILT_VIA_BUILDKIT" \
            --tag "aptos-node-e2e:$GIT_SHA" \
            .

          container_id="$(docker create "aptos-node-e2e:$GIT_SHA")"
          mkdir -p artifact
          docker cp "$container_id:/aptos/dist/aptos-node" artifact/aptos-node
          docker rm "$container_id"
          chmod 755 artifact/aptos-node
          sha256sum artifact/aptos-node > artifact/aptos-node.sha256

      - name: Upload aptos-node binary
        uses: actions/upload-artifact@v4
        with:
          name: aptos-node-${{ steps.metadata.outputs.git_sha }}
          path: artifact/
          compression-level: 9
          retention-days: 1
