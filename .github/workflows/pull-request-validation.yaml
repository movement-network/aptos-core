---
name: "✅ PR Checks"
run-name: "Running Checks for ${{ github.ref_name }}"
on:
  pull_request:
    branches:
      - movement
      - l1-migration
    types: [labeled, opened, synchronize, reopened, auto_merge_enabled]

env:
  GIT_SHA: ${{ github.sha }}
  GIT_BRANCH: ${{ github.ref_name }}
  BUILD_DATE: ${{ github.event.head_commit.timestamp }}
  BUILT_VIA_BUILDKIT: "true"
  FEATURES: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dynamic-deps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.SKIP_JOB }}
        with:
          ref: ${{ inputs.GIT_SHA }}
          
      # This will exit with failure if any of the banned dynamic deps are found.
      - run: ./crates/aptos/scripts/check_dynamic_deps.sh
  
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest

    container:
      image: returntocorp/semgrep
      options: --user root

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci
        env:
           SEMGREP_RULES: >-
             ./.github/linters/semgrep/pull-request-target-code-checkout.yaml

  build-checks:
    runs-on: k8s-movement-labs
    outputs:
      members_changed: ${{ steps.members_check.outputs.changed }}
      docker_changed: ${{ steps.docker_check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if Cargo Members Changed
        id: members_check
        uses: ./.github/actions/cargo-members-changed
        with:
          base-ref: ${{ github.event.pull_request.base.ref || 'l1-migration' }}
      - name: Check if Docker Files Changed
        id: docker_check
        uses: ./.github/actions/docker-files-changed
        with:
          base-ref: ${{ github.event.pull_request.base.ref || 'l1-migration' }}

  build-binaries:
    needs: build-checks
    if: needs.build-checks.outputs.members_changed == 'true' || needs.build-checks.outputs.docker_changed == 'true'
    runs-on: ${{ matrix.runner }}
    name: "Build ${{ matrix.binary_file }} with Nix (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: k8s-movement-labs
            arch: amd64
            binary_attr: aptos-node
            binary_file: aptos-node
          - runner: k8s-movement-labs
            arch: amd64
            binary_attr: movement
            binary_file: movement
          - runner: k8s-movement-labs
            arch: amd64
            binary_attr: l1-migration
            binary_file: l1-migration
          - runner: k8s-movement-labs
            arch: amd64
            binary_attr: aptos-faucet-service
            binary_file: aptos-faucet-service
          - runner: k8s-movement-labs
            arch: amd64
            binary_attr: aptos-transaction-emitter
            binary_file: aptos-transaction-emitter
          - runner: ubuntu-24.04-arm
            arch: arm64
            binary_attr: aptos-node
            binary_file: aptos-node
          - runner: ubuntu-24.04-arm
            arch: arm64
            binary_attr: movement
            binary_file: movement
          - runner: ubuntu-24.04-arm
            arch: arm64
            binary_attr: l1-migration
            binary_file: l1-migration
          - runner: ubuntu-24.04-arm
            arch: arm64
            binary_attr: aptos-faucet-service
            binary_file: aptos-faucet-service
          - runner: ubuntu-24.04-arm
            arch: arm64
            binary_attr: aptos-transaction-emitter
            binary_file: aptos-transaction-emitter
    env:
      TARGET_FOLDER: target/${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure Cachix (pull)
        uses: cachix/cachix-action@v15
        with:
          name: movement-m1
          skipPush: true

      - name: Build ${{ matrix.binary_file }}
        run: |
          set -euo pipefail
          set -o pipefail
          echo "Building ${{ matrix.binary_attr }} for ${{ matrix.arch }}..."
          nix --extra-experimental-features "nix-command flakes" build ".#${{ matrix.binary_attr }}" -L --print-build-logs 2>&1 | tee /tmp/nix-build-${{ matrix.binary_attr }}-${{ matrix.arch }}.log
          mkdir -p "${{ env.TARGET_FOLDER }}"
          cp "result/bin/${{ matrix.binary_file }}" "${{ env.TARGET_FOLDER }}/${{ matrix.binary_file }}"
          chmod +x "${{ env.TARGET_FOLDER }}/${{ matrix.binary_file }}"

          CACHE_LINES=$(grep -Ei "movement-m1\.cachix\.org|copying path" /tmp/nix-build-${{ matrix.binary_attr }}-${{ matrix.arch }}.log || true)
          if [ -n "$CACHE_LINES" ]; then
            echo "Detected cache activity for ${{ matrix.binary_file }} (${{ matrix.arch }}):"
            echo "$CACHE_LINES"
          else
            echo "::warning::No explicit Cachix download line detected for ${{ matrix.binary_file }} (${{ matrix.arch }})."
          fi

      - name: Verify binary
        run: |
          if [ -f "${{ env.TARGET_FOLDER }}/${{ matrix.binary_file }}" ]; then
            echo "✅ Binary ${{ matrix.binary_file }} built successfully"
            ls -la "${{ env.TARGET_FOLDER }}/${{ matrix.binary_file }}"
          else
            echo "❌ Binary ${{ matrix.binary_file }} not found"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_file }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ env.TARGET_FOLDER }}/${{ matrix.binary_file }}
          retention-days: 7

  build-docker:
    needs: build-binaries
    runs-on: ubuntu-latest
    name: "Build Docker Images"
    permissions:
      contents: read
      packages: write
    env:
      TARGET_FOLDER: target/debug
    steps:
      - uses: actions/checkout@v4
      
      # Download artifacts
      - name: Download aptos-node binary
        uses: actions/download-artifact@v4
        with:
          name: aptos-node-amd64-${{ github.sha }}
          path: ${{ env.TARGET_FOLDER }}
      - name: Download movement binary
        uses: actions/download-artifact@v4
        with:
          name: movement-amd64-${{ github.sha }}
          path: ${{ env.TARGET_FOLDER }}
      - name: Download l1-migration binary
        uses: actions/download-artifact@v4
        with:
          name: l1-migration-amd64-${{ github.sha }}
          path: ${{ env.TARGET_FOLDER }}
      - name: List binaries
        run: ls -la ${{ env.TARGET_FOLDER }}
      # Setup Docker Buildx (replaces manual Docker checks)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      # Log in to GHCR (can also use docker/login-action)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.INFRA_GH_USER }}
          password: ${{ secrets.INFRA_GH_PAT }}
      
      # Set build environment variables
      - name: Set build environment
        run: |
          echo "GIT_SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
      
      # Build and push Docker image
      - name: Build and push aptos-node Docker image
        run: |
          docker build --build-arg BINARY_PATH=target/debug -f docker/aptos-node/Dockerfile -t ghcr.io/movementlabsxyz/aptos-node:${{ env.GIT_SHA_SHORT }} .
          docker push ghcr.io/movementlabsxyz/aptos-node:${{ env.GIT_SHA_SHORT }}
      
      # Output image information
      - name: Output image information
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image: ghcr.io/movementlabsxyz/aptos-node:${{ env.GIT_SHA_SHORT }}"
          echo "🏷️  Tag: ${{ env.GIT_SHA_SHORT }}"
          echo "🌐 Registry: ghcr.io/movementlabsxyz/aptos-node"
