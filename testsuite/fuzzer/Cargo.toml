[package]
name = "fuzzer"
version = "0.1.0"
edition = "2021"
license = { workspace = true }

[dependencies]
aptos-cached-packages = { workspace = true }
aptos-framework = { workspace = true }
aptos-language-e2e-tests = { workspace = true, features = ["fuzzing"] }
aptos-transaction-simulation = { workspace = true }
aptos-types = { workspace = true, features = ["fuzzing"] }
aptos-vm = { workspace = true }
aptos-vm-environment = { workspace = true }
arbitrary = { workspace = true, features = ["derive"] }
base64 = "0.21.7"
bcs = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
dearbitrary = { workspace = true }
hex = { workspace = true }
move-binary-format = { workspace = true, features = ["fuzzing"] }
move-bytecode-verifier = { workspace = true }
move-core-types = { workspace = true, features = ["fuzzing"] }
move-vm-types = { workspace = true, features = ["fuzzing"] }
once_cell = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }

[[bin]]
name = "crash_replay"
path = "src/crash_replay.rs"

[[bin]]
name = "build_exploit"
path = "src/build_exploit.rs"
